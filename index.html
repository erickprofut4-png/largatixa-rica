<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LARGATIXA RICA — Arcade Recreativo</title>
  <style>
    :root {
      --bg: #050505;
      --card: #0f0f0f;
      --card-2: #161616;
      --neon: #39ff14;
      --neon-dim: rgba(57, 255, 20, 0.16);
      --text: #f3f3f3;
      --muted: #9aa09a;
      --danger: #ff4d4d;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #1e1e1e;
      background: #080808;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--neon);
      text-shadow: 0 0 12px rgba(57, 255, 20, 0.45);
    }

    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--neon);
      color: var(--neon);
      background: var(--neon-dim);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid #222;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h2, h3 {
      margin-top: 0;
      color: var(--neon);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    input, select, button {
      font-size: 1rem;
      border-radius: 10px;
      padding: 11px 14px;
      border: 1px solid #2c2c2c;
      background: var(--card-2);
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--neon);
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--neon);
      color: #050505;
      border-color: var(--neon);
    }

    button.primary:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 0 14px rgba(57, 255, 20, 0.4);
    }

    button.outline {
      border-color: var(--neon);
      color: var(--neon);
      background: transparent;
    }

    button.outline.active, button.outline:hover:not(:disabled) {
      background: var(--neon);
      color: #050505;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
