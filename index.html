<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LARGATIXA RICA</title>
  <style>
    :root {
      --bg: #070b08;
      --surface: #0e1510;
      --surface-2: #141f17;
      --border: #1e3324;
      --neon: #22ff66;
      --neon-soft: rgba(34, 255, 102, 0.14);
      --neon-glow: 0 0 18px rgba(34, 255, 102, 0.25);
      --text: #f2fff6;
      --muted: #8ca694;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(circle at top, rgba(34, 255, 102, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      padding: 14px;
      padding-bottom: 56px;
    }

    .wrap {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--neon-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--neon);
      letter-spacing: 0.05em;
    }

    .sub {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--neon);
      color: #051108;
      border-color: var(--neon);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    .player-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    input, select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--neon);
    }

    .games-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-bottom: 14px
